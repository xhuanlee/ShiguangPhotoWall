name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # CI 注入签名密钥（未配置时回退 debug 签名）
      - name: Decode signing keystore
        if: ${{ secrets.SGPW_KEYSTORE_BASE64 != '' }}
        env:
          SGPW_KEYSTORE_BASE64: ${{ secrets.SGPW_KEYSTORE_BASE64 }}
        run: |
          echo "$SGPW_KEYSTORE_BASE64" | base64 --decode > $RUNNER_TEMP/release.keystore
          echo "SGPW_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SGPW_KEYSTORE_PASSWORD=${{ secrets.SGPW_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "SGPW_KEY_ALIAS=${{ secrets.SGPW_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "SGPW_KEY_PASSWORD=${{ secrets.SGPW_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK (mobile)
        run: flutter build apk --release --flavor mobile

      - name: Build release APK (tv)
        run: flutter build apk --release --flavor tv

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-mobile-release.apk \
            dist/sgphotowall-mobile-${{ github.ref_name }}.apk
          cp build/app/outputs/flutter-apk/app-tv-release.apk \
            dist/sgphotowall-tv-${{ github.ref_name }}.apk

      - name: Generate release notes
        run: |
          cat > dist/RELEASE_NOTES.md <<'EOF'
          ## 拾光 · 影像墙 ${{ github.ref_name }}

          ### 下载

          | 安装包 | 说明 |
          | --- | --- |
          | `sgphotowall-mobile-*.apk` | 手机端（照片 / 视频聚合浏览） |
          | `sgphotowall-tv-*.apk` | Android TV 端（照片墙 + 遥控器播放） |

          > 首次使用：手机端绑定云盘账号并选择同步文件夹；TV 端通过二维码完成局域网配对。
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/sgphotowall-mobile-${{ github.ref_name }}.apk
            dist/sgphotowall-tv-${{ github.ref_name }}.apk
